async function getUsers() {
  const url = "https://quasiquarks.com/chat/index.php";
  try {
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`Response status: ${response.status}`);
    }

    const result = await response.json();
    console.log(result);
  } catch (error) {
    console.error(error.message);
  }
}
async function getChat() {
  const url = "https://quasiquarks.com/chat/chat.php";
  try {
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`Response status: ${response.status}`);
    }

    const result = await response.json();
    console.log(result);
  } catch (error) {
    console.error(error.message);
  }
}

document.getElementById("chatForm").addEventListener("submit", async function(e) {
    e.preventDefault(); // stop normal form submit

    const form = document.getElementById("chatForm");
    const formData = new FormData(form);

    try {
      const response = await fetch("https://quasiquarks.com/chat/insert.php", {
        method: "POST",
        body: formData        // FormData sets its own multipart/form-data headers
      });

      const data = await response.json();
      console.log(data);

      document.getElementById("result").textContent = JSON.stringify(data, null, 2);
        getChat();
      if (data.success) {
        // Clear message box after successful insert
        document.getElementById("message").value = "";
        document.getElementById("fileToUpload").value = "";
      }
    } catch (err) {
      console.error(err);
      document.getElementById("result").textContent = "Error: " + err;
    }
  });
