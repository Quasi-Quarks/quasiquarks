<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My PDF Library</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      margin-bottom: 10px;
    }
    .pdf-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .pdf-item {
      background: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .pdf-item:hover {
      background: #eaeaea;
    }
    #pdfViewer {
      width: 100%;
      height: 54vh;
      margin-top: 20px;
      border: none;
    }
  </style>
</head>
<body>

  <div id="menu">
    <p>Introduction</p>
    <p>Tawheed</p>
    <p>Creed</p>
    <p>Fiqh</p>
    <p>Quran</p>
  </div>

  <div class="pdf-list">
    <div class="pdf-item" onclick="loadPDF('book.pdf')">
      📄 File 1 – Introduction
    </div>
  </div>

  <!-- PDF Viewer inside the page -->
  <iframe id="pdfViewer"></iframe>

  <script>
    function loadPDF(path) {
      document.getElementById('pdfViewer').src = path;
    }
  </script>

</body>
</html>
