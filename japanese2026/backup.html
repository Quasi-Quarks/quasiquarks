<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EN → JA Translator</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #0b0e14;
    color: #fff;
    padding: 30px;
  }
  textarea {
    width: 100%;
    height: 100px;
    padding: 12px;
    font-size: 16px;
  }
  button {
    margin-top: 10px;
    padding: 10px 16px;
    font-size: 16px;
    cursor: pointer;
  }
  .out {
    margin-top: 20px;
    background: #121826;
    padding: 12px;
    border-radius: 8px;
  }
</style>
</head>
<body>

<h2>English → Japanese</h2>

<textarea id="input">this is a fish from the market</textarea>
<button onclick="translate()">Translate</button>

<div class="out">
  <strong>Japanese:</strong>
  <div id="ja">—</div>
</div>

<div class="out">
  <strong>Romaji:</strong>
  <div id="romaji">—</div>
</div>

<script>
async function translate() {
  const text = document.getElementById("input").value;

  const params = new URLSearchParams({
    client: "gtx",
    sl: "en",
    tl: "ja",
    dj: "1",
    ie: "UTF-8",
    oe: "UTF-8",
    q: text
  });

  params.append("dt", "t");
  params.append("dt", "rm");

  const url =
    "https://translate.googleapis.com/translate_a/single?" +
    params.toString();

  const res = await fetch(url);
  const data = await res.json();

  const sentences = data.sentences || [];

  document.getElementById("ja").textContent =
    sentences.map(s => s.trans).join("");

  document.getElementById("romaji").textContent =
    sentences.map(s => s.translit || "").join(" ").trim();
}
</script>

</body>
</html>
