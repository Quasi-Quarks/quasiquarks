/* =========================
   TRANSLATION (EN → JA)
========================= */

async function translateText() {
  const text = document.getElementById("input").value.trim();
  if (!text) return;

  const params = new URLSearchParams({
    client: "gtx",
    sl: "en",
    tl: "ja",
    dj: "1",
    ie: "UTF-8",
    oe: "UTF-8",
    q: text
  });

  params.append("dt", "t");
  params.append("dt", "rm");

  const url =
    "https://translate.googleapis.com/translate_a/single?" +
    params.toString();

  const res = await fetch(url);
  const data = await res.json();

  const sentences = data.sentences || [];

  document.getElementById("jp").textContent =
    sentences.map(s => s.trans).join("");

    speech_jp = sentences.map(s => s.trans).join("");
    

  document.getElementById("romaji").textContent =
    sentences.map(s => s.translit || "").join(" ").trim();

      speech_jptr = 
    sentences.map(s => s.translit || "").join(" ").trim();
}

/* =========================
   WEB SPEECH API (VOICES)
========================= */

let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();
  const select = document.getElementById("voiceSelect");
  select.innerHTML = "";

  voices.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.voiceURI;
    opt.textContent = `${v.name} — ${v.lang}`;
    select.appendChild(opt);
  });

  // auto-select Japanese voice
  const jp = voices.find(v => v.lang.startsWith("ja"));
  if (jp) select.value = jp.voiceURI;
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speakJapanese() {
  const text =
    document.getElementById("romaji").textContent !== "—"
      ? document.getElementById("romaji").textContent
      : document.getElementById("jp").textContent;

  if (!text) return;

  const u = new SpeechSynthesisUtterance(text);
  const voiceURI = document.getElementById("voiceSelect").value;
  const v = voices.find(v => v.voiceURI === voiceURI);
  if (v) u.voice = v;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function stopSpeaking() {
  speechSynthesis.cancel();
}

/* =========================
   GOOGLE MP3 FALLBACK
========================= */

function playMp3() {
  const text =
    document.getElementById("romaji").textContent !== "—"
      ? document.getElementById("romaji").textContent
      : document.getElementById("jp").textContent;

  if (!text) return;

  const url =
    "https://translate.googleapis.com/translate_tts?" +
    new URLSearchParams({
      ie: "UTF-8",
      q: text,
      tl: "ja",
      client: "gtx"
    });

  const audio = document.getElementById("audio");
  audio.src = url;
  audio.play();
}
