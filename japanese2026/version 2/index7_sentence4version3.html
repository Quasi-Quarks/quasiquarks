            async function render_single_speech(a, b, container) {
  const item = list_array_speech[chat_room_no][a][b];

  const en = item[1];
  const jp = item[2];
  const rm = item[3];
  const isBreakdown = item[4];

  container.innerHTML = "";

  if (!isBreakdown) {
    // NORMAL VIEW
    container.appendChild(makeP(en, "en"));
    container.appendChild(makeP(jp, "jp"));
    container.appendChild(makeP(rm, "rm"));
    container.appendChild(makePlusControls(a, b));
    return;
  }

  // BREAKDOWN VIEW
  const row = document.createElement("div");
  row.className = "chat-row";

  const words = en.split(/\s+/);

  for (const word of words) {
    const { jp, rm } = await translateWord(word);

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = `
      <div class="en">${word}</div>
      <div class="jp">${jp}</div>
      <div class="rm">${rm}</div>
    `;

    row.appendChild(bubble);
    row.scrollLeft = row.scrollWidth;

    await sleep(time_secs * 1000);
  }

  container.appendChild(row);
  container.appendChild(makePlusControls(a, b));
}


function makeP(text, cls) {
  const p = document.createElement("p");
  p.className = cls;
  p.innerText = text;
  return p;
}

function makePlusControls(a, b) {
  const wrap = document.createElement("div");
  wrap.className = "controls";

  const plus = document.createElement("p");
  plus.innerText = "+";
  plus.className = "plus_element";

  const minus = document.createElement("p");
  minus.innerText = "-";
  minus.className = "plus_breakdown";

  minus.onclick = function () {
    list_array_speech[chat_room_no][a][b][4] = false;
    create_speech();
  };

  wrap.appendChild(plus);
  wrap.appendChild(minus);
  return wrap;
}

let time_secs = 2; // 👈 adjust freely

/* ==============================
   TRANSLATE + ROMAJI
   ============================== */
async function translateWord(word) {
  const url =
    "https://translate.googleapis.com/translate_a/single" +
    "?client=gtx&sl=en&tl=ja&dt=t&dt=rm&q=" +
    encodeURIComponent(word);

  const res = await fetch(url);
  const data = await res.json();

  let jp = "";
  let rm = "";

  if (data && data[0]) {
    // Japanese text
    jp = data[0][0]?.[0] || "";

    // Romaji (sometimes missing, so guard it)
    rm = data[0][1]?.[2] || "";
  }

  return { jp, rm };
}


/* ==============================
   MAIN FLOW
   ============================== */
async function startTranslation() {
  const input = document.getElementById("inputText");
  const text = input.value.trim();
  if (!text) return;

  const words = text.split(/\s+/);

  const row = document.createElement("div");
  row.className = "chat-row";
  document.getElementById("chatArea").appendChild(row);

  for (const word of words) {
    const { jp, rm } = await translateWord(word);

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = `
      <div class="en">${word}</div>
      <div class="jp">${jp}</div>
      <div class="rm">${rm}</div>
    `;

    row.appendChild(bubble);
    row.scrollLeft = row.scrollWidth;

    await sleep(time_secs * 1000);
  }

  input.value = "";
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function translateText() {
  const text = document.getElementById("input").value.trim();
  if (!text) return;

  const params = new URLSearchParams({
    client: "gtx",
    sl: "en",
    tl: "ja",
    dj: "1",
    ie: "UTF-8",
    oe: "UTF-8",
    q: text
  });

  params.append("dt", "t");
  params.append("dt", "rm");

  const url =
    "https://translate.googleapis.com/translate_a/single?" +
    params.toString();

  const res = await fetch(url);
  const data = await res.json();

  const sentences = data.sentences || [];

  document.getElementById("jp").textContent =
    sentences.map(s => s.trans).join("");

    speech_jp = sentences.map(s => s.trans).join("");
    

  document.getElementById("romaji").textContent =
    sentences.map(s => s.translit || "").join(" ").trim();

      speech_jptr = 
    sentences.map(s => s.translit || "").join(" ").trim();

    call()
    playMp3()
}

/* =========================
   WEB SPEECH API (VOICES)
========================= */

let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();
  const select = document.getElementById("voiceSelect");
  select.innerHTML = "";

  voices.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.voiceURI;
    opt.textContent = `${v.name} — ${v.lang}`;
    select.appendChild(opt);
  });

  // auto-select Japanese voice
  const jp = voices.find(v => v.lang.startsWith("ja"));
  if (jp) select.value = jp.voiceURI;
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speakJapanese() {
  const text =
    document.getElementById("romaji").textContent !== "—"
      ? document.getElementById("romaji").textContent
      : document.getElementById("jp").textContent;

  if (!text) return;

  const u = new SpeechSynthesisUtterance(text);
  const voiceURI = document.getElementById("voiceSelect").value;
  const v = voices.find(v => v.voiceURI === voiceURI);
  if (v) u.voice = v;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function stopSpeaking() {
  speechSynthesis.cancel();
}

/* =========================
   GOOGLE MP3 FALLBACK
========================= */

function playMp3() {
  const text =
    document.getElementById("romaji").textContent !== "—"
      ? document.getElementById("romaji").textContent
      : document.getElementById("jp").textContent;

  if (!text) return;

  const url =
    "https://translate.googleapis.com/translate_tts?" +
    new URLSearchParams({
      ie: "UTF-8",
      q: text,
      tl: "ja",
      client: "gtx"
    });

  const audio = document.getElementById("audio");
  audio.src = url;
  audio.play();
}
