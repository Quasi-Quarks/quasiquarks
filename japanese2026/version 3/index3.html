<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English → Japanese Translator</title>

<style>
:root {
  --bg: #0f172a;
  --panel: #111827;
  --bubble: #1f2933;
  --text: #e5e7eb;
  --accent: #38bdf8;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 2rem;
}

.app {
  width: 100%;
  max-width: 900px;
  background: var(--panel);
  border-radius: 16px;
  padding: 1.5rem;
}

h1 {
  margin-top: 0;
  text-align: center;
}

.input-area {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

textarea {
  flex: 1;
  resize: none;
  padding: 0.75rem;
  border-radius: 8px;
  border: none;
  outline: none;
  font-size: 1rem;
}

button {
  padding: 0 1.25rem;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  background: var(--accent);
  color: #000;
  font-weight: bold;
}

.chat-area {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* Each chat row */
.chat-row {
  background: #020617;
  border-radius: 12px;
  padding: 0.75rem;
  overflow-x: auto;
  display: flex;
  gap: 0.5rem;
  white-space: nowrap;
}

/* Word bubble */
.bubble {
  background: var(--bubble);
  border-radius: 999px;
  padding: 0.5rem 0.9rem;
  font-size: 0.95rem;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  flex-shrink: 0;
}

.bubble span.en {
  opacity: 0.6;
}

.bubble span.jp {
  color: var(--accent);
}
</style>
</head>

<body>
<div class="app">
  <h1>English → Japanese</h1>

  <div class="input-area">
    <textarea id="inputText" rows="2" placeholder="Type an English sentence..."></textarea>
    <button onclick="startTranslation()">Translate</button>
  </div>

  <div id="chatArea" class="chat-area"></div>
</div>

<script>
/* ==============================
   CONFIGURABLE DELAY (SECONDS)
   ============================== */
let time_secs = 2; // 👈 change this freely

/* ==============================
   GOOGLE TRANSLATE (UNOFFICIAL)
   ============================== */
async function translateWord(word) {
  const url =
    "https://translate.googleapis.com/translate_a/single" +
    "?client=gtx&sl=en&tl=ja&dt=t&q=" +
    encodeURIComponent(word);

  const res = await fetch(url);
  const data = await res.json();
  return data[0][0][0];
}

/* ==============================
   MAIN FLOW
   ============================== */
async function startTranslation() {
  const text = document.getElementById("inputText").value.trim();
  if (!text) return;

  const words = text.split(/\s+/);

  // Create a new horizontal chat row
  const row = document.createElement("div");
  row.className = "chat-row";
  document.getElementById("chatArea").appendChild(row);

  for (let word of words) {
    const jp = await translateWord(word);

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = `
      <span class="en">${word}</span>
      →
      <span class="jp">${jp}</span>
    `;

    row.appendChild(bubble);

    // Auto-scroll horizontally
    row.scrollLeft = row.scrollWidth;

    // Delay before next word
    await sleep(time_secs * 1000);
  }

  document.getElementById("inputText").value = "";
}

/* ==============================
   UTILITY
   ============================== */
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}
</script>
</body>
</html>
