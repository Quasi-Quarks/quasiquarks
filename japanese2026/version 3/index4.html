<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English → Japanese (with Romaji)</title>

<style>
:root {
  --bg: #0f172a;
  --panel: #111827;
  --bubble: #1f2933;
  --text: #e5e7eb;
  --accent: #38bdf8;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 2rem;
}

.app {
  width: 100%;
  max-width: 950px;
  background: var(--panel);
  border-radius: 16px;
  padding: 1.5rem;
}

h1 {
  margin-top: 0;
  text-align: center;
}

.input-area {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

textarea {
  flex: 1;
  resize: none;
  padding: 0.75rem;
  border-radius: 8px;
  border: none;
  outline: none;
  font-size: 1rem;
}

button {
  padding: 0 1.25rem;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  background: var(--accent);
  color: #000;
  font-weight: bold;
}

.chat-area {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* Horizontal message row */
.chat-row {
  background: #020617;
  border-radius: 12px;
  padding: 0.75rem;
  overflow-x: auto;
  display: flex;
  gap: 0.6rem;
  white-space: nowrap;
}

/* Word bubble */
.bubble {
  background: var(--bubble);
  border-radius: 14px;
  padding: 0.55rem 0.9rem;
  display: inline-flex;
  flex-direction: column;
  gap: 0.15rem;
  flex-shrink: 0;
  min-width: 110px;
}

.en {
  font-size: 0.8rem;
  opacity: 0.55;
}

.jp {
  font-size: 1.05rem;
  color: var(--accent);
}

.rm {
  font-size: 0.8rem;
  opacity: 0.7;
}
</style>
</head>

<body>
<div class="app">
  <h1>English → Japanese (Romaji)</h1>

  <div class="input-area">
    <textarea id="inputText" rows="2" placeholder="Type an English sentence..."></textarea>
    <button onclick="startTranslation()">Translate</button>
  </div>

  <div id="chatArea" class="chat-area"></div>
</div>

<script>
/* ==============================
   CONFIGURABLE DELAY (SECONDS)
   ============================== */
let time_secs = 2; // 👈 adjust freely

/* ==============================
   TRANSLATE + ROMAJI
   ============================== */
async function translateWord(word) {
  const url =
    "https://translate.googleapis.com/translate_a/single" +
    "?client=gtx&sl=en&tl=ja&dt=t&dt=rm&q=" +
    encodeURIComponent(word);

  const res = await fetch(url);
  const data = await res.json();

  let jp = "";
  let rm = "";

  if (data && data[0]) {
    // Japanese text
    jp = data[0][0]?.[0] || "";

    // Romaji (sometimes missing, so guard it)
    rm = data[0][1]?.[2] || "";
  }

  return { jp, rm };
}


/* ==============================
   MAIN FLOW
   ============================== */
async function startTranslation() {
  const input = document.getElementById("inputText");
  const text = input.value.trim();
  if (!text) return;

  const words = text.split(/\s+/);

  const row = document.createElement("div");
  row.className = "chat-row";
  document.getElementById("chatArea").appendChild(row);

  for (const word of words) {
    const { jp, rm } = await translateWord(word);

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = `
      <div class="en">${word}</div>
      <div class="jp">${jp}</div>
      <div class="rm">${rm}</div>
    `;

    row.appendChild(bubble);
    row.scrollLeft = row.scrollWidth;

    await sleep(time_secs * 1000);
  }

  input.value = "";
}

/* ==============================
   UTILITY
   ============================== */
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}
</script>
</body>
</html>
