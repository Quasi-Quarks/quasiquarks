<body>

<script src="totaljapanese2.js"></script>
<script>
var dictionary = [
  a_action, b_object, c_career, d_environment, e_position,
  f_time, g_stuff, h_description, i_animal, j_body,
  k_clothing, l_feeling, m_food, n_personal,
  o_sentence, p_transportation, q_pronoun
];

var a_action_check = ["base_verb", "present_participle", "past_tense"];

var selected_word = "eating";
var keyword = "";
function loop_words(situation) {

  for (let x = 0; x < dictionary.length; x++) {
    let category = dictionary[x];

    for (let i = 0; i < category.length; i++) {
      let entry = category[i];

      // Handle arrays nested inside array (like b_object, c_career)
      if (Array.isArray(entry)) {
        for (let sub of entry) {
          for (let key in sub) {
            if (key.includes("en_") && sub[key]) {
                // console.log(sub[key]);
            if(situation == "search_traverse_1") {
             if(selected_word == sub[key]) { 
                 console.log(sub[key]);
             keyword = key;

             }
            }  else if( situation == "searching_traverse_2" && key == keyword ) {
               console.log(sub[key]);
            }
            }
          }
        }
      } else {
        // a_action special case
        if (x === 0) {
          for (let j = 0; j < a_action_check.length; j++) {
            let key = a_action_check[j];
            if (entry[key]?.en) {
              //console.log(entry[key].en);

              if(situation == "search_traverse_1") {
             if(selected_word == entry[key]?.en) { 
                 console.log(entry[key]?.en);
             keyword = key;
             
             }
            }  else if( situation == "searching_traverse_2" && key == keyword ) {
               console.log(entry[key]?.en);
            }
            }
          }
        } else {
          // other categories: object with keys containing "en_"
          for (let key in entry) {
            if (key.includes("en_") && entry[key]) {
             // console.log(entry[key]);

             if(situation == "search_traverse_1") {
             if(selected_word == entry[key]) { 
                 console.log(entry[key]);
             keyword = key;
             
             }
            }  else if( situation == "searching_traverse_2" && key == keyword ) {
               console.log(entry[key]);
            }
            }
          }
        }
      }

    }
  }



  if(keyword !== "") {
      //alert(keyword)
    if(situation == "searching_traverse_2") {
        keyword = ""
    } else {
    loop_words("searching_traverse_2")
  
    }

}

}

loop_words("search_traverse_1");
</script>
