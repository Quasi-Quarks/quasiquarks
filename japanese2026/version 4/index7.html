<body>

        <div id="app_container">

            <div id="choose_lang_page">

        </div>
        
            <div id="app_translator">
                <div id="left_bar"> 
                    <button onclick="createRoom()">Create Room</button>
                </div>
                <div id="main_translator">
                    <div id="chat_Page"></div>
                    <div id="send_container">
                    <input id="input_box" value="hello world">
                    <button id="new_chat_input">New Button</button>
                    <p id="jp"></p>

<script src="totaljapanese2.js"></script>
<script>
  var app_chat_data = {};

  var languages_array = ["english", "japanese", "arabic", "chinese"];


  var chatroom_language = "";

  chatroom_number = "";

  function choose_language() {
  for (let l = 0; l < languages_array.length; l++) {
    let language = languages_array[l];

    var btn = document.createElement("button");
    btn.innerText = language;

    btn.onclick = function () {
      chatroom_language = language;

      // create language if not exists
      if (!app_chat_data[language]) {
        app_chat_data[language] = {};
        var roomCount = Object.keys(app_chat_data[chatroom_language]).length;
        if (roomCount == 0) {
            alert("there is no room")
            var roomName = "room" + roomCount;
            app_chat_data[chatroom_language][roomName] = [];
            chatroom_number = roomName;
            show_room(app_chat_data[chatroom_language][chatroom_number])
        } 
      } else {
            alert("there is is a room")
            // choose the first room
            var room_key = Object.keys(app_chat_data[chatroom_language]);
            var default_room = room_key[0];
            chatroom_number = default_room;
            console.log("First room:", default_room);
            console.log(app_chat_data[chatroom_language][default_room]);
            show_room(app_chat_data[chatroom_language][default_room])
        }




      console.log("Language selected:", chatroom_language);
      console.log(app_chat_data);
    };

    document.getElementById("choose_lang_page").appendChild(btn);
  }
}

choose_language();

var toggle = ""

function show_room(room_id) {
    
    document.getElementById("chat_Page").innerHTML = ""
     for(let r=0; r<=room_id.length + -1; r++) {
     
        
          if (r % 2 === 0) {
            console.log(r + " is Even");
            toggle = "chat_container chat__right"
          } else {
            console.log(r + " is Odd");
            toggle = "chat_container chat__left"
          }
        

         console.log(room_id[r])

          var chat_container = document.createElement("div");
          chat_container.setAttribute("class", toggle)

          var output_english = document.createElement("p");
          output_english.setAttribute("class", "output_english")
          output_english.innerText = room_id[r][0];

          output_english.onclick = async function() {
              var input_box_data = document.getElementById("input_box").value;
              this.innerText = input_box_data;
              app_chat_data[chatroom_language][chatroom_number][r] = input_box_data;
              await translateText(document.getElementById("input_box").value);
              alert(r)
          }

          var edit_english = document.createElement("p");
          edit_english.setAttribute("class", "edit_english")
          edit_english.innerText = "edit_text"

          edit_english.onclick = function() {
              var input_box_data = document.getElementById("input_box").value;
              app_chat_data[chatroom_language][chatroom_number][r][0] = input_box_data;
              
              func_edit_container(r)
              //show_room(room_id)
              alert(r)
          }

          function func_edit_container(r_edit) {
             var edit_container = document.createElement("div");
          edit_container.setAttribute("class", "edit_container");

          var edit_input_data = document.createElement("input");
          edit_input_data.setAttribute("class", "edit_input_data");
          edit_input_data.setAttribute("value", app_chat_data[chatroom_language][chatroom_number][r_edit][0]);

          var send_edit = document.createElement("button");
          send_edit.setAttribute("class", "send_edit");
          send_edit.innerText = "Send";

          send_edit.onclick = async function() {
            alert(edit_input_data.value)
            await translateText(edit_input_data.value, "edit", r_edit);
          }

          var cancel_edit = document.createElement("button");
          cancel_edit.innerText = "Cancel";
          cancel_edit.setAttribute("class", "cancel_edit");

          cancel_edit.onclick = async function() {
            const nodeList = document.querySelectorAll(".chat_container");
            edit_container.style.display = "none"
          }

          edit_container.appendChild(edit_input_data)
          edit_container.appendChild(send_edit);
          edit_container.appendChild(cancel_edit);

          const nodeList = document.querySelectorAll(".chat_container");
          nodeList[r_edit].appendChild(edit_container);
          }

          var output_jp = document.createElement("p");
          output_jp.setAttribute("class", "output_jp")
          output_jp.innerText = room_id[r][1];

          var output_jptr = document.createElement("p");
          output_jptr.setAttribute("class", "output_jptr")
          output_jptr.innerText = room_id[r][2];
          
       
         
          console.log(toggle)

          chat_container.appendChild(output_english)
          chat_container.appendChild(output_jp)
          chat_container.appendChild(output_jptr)
          chat_container.appendChild(edit_english)
          
          document.getElementById("chat_Page").appendChild(chat_container)
     }
 }



  function createRoom() {
  if (!chatroom_language) {
    alert("Select a language first");
    return;
  }

  var roomCount = Object.keys(app_chat_data[chatroom_language]).length + 1;
  var roomName = "room" + roomCount;

  app_chat_data[chatroom_language][roomName] = [];
  chatroom_number = roomName;

  console.log("Room created:", roomName);
  console.log(app_chat_data);
}



document.getElementById("new_chat_input").onclick = async function () {
  if (!chatroom_language || !chatroom_number) {
    alert("Select language and room first");
    return;
  }

  await translateText(document.getElementById("input_box").value); // wait for fetch + push
  console.log(app_chat_data);
};


async function translateText(text_data, para, r) {
 
  const text = text_data.trim();
  if (!text) return;

  const params = new URLSearchParams({
    client: "gtx",
    sl: "en",
    tl: "ja",
    dj: "1",
    ie: "UTF-8",
    oe: "UTF-8",
    q: text
  });

  params.append("dt", "t");
  params.append("dt", "rm");

  const url =
    "https://translate.googleapis.com/translate_a/single?" +
    params.toString();

  const res = await fetch(url);
  const data = await res.json();

  const sentences = data.sentences || [];

  document.getElementById("jp").textContent =
    sentences.map(s => s.trans).join("");

    speech_jp = sentences.map(s => s.trans).join("");
    

  document.getElementById("romaji").textContent =
    sentences.map(s => s.translit || "").join(" ").trim();

      speech_jptr = 
    sentences.map(s => s.translit || "").join(" ").trim();


     data_input = [
            text,
            speech_jp,
            speech_jptr
            ];

      if(para == "edit") {
          app_chat_data[chatroom_language][chatroom_number][r] = data_input
      } else {

        app_chat_data[chatroom_language][chatroom_number].push(data_input);
      }
            
    

        show_room(app_chat_data[chatroom_language][chatroom_number])



}

var dictionary = [
  a_action, b_object, c_career, d_environment, e_position,
  f_time, g_stuff, h_description, i_animal, j_body,
  k_clothing, l_feeling, m_food, n_personal,
  o_sentence, p_transportation, q_pronoun
];

var a_action_check = ["base_verb", "present_participle", "past_tense"];

var selected_word = "eating";
var keyword = "";
function loop_words(situation) {

  for (let x = 0; x < dictionary.length; x++) {
    let category = dictionary[x];

    for (let i = 0; i < category.length; i++) {
      let entry = category[i];

      // Handle arrays nested inside array (like b_object, c_career)
      if (Array.isArray(entry)) {
        for (let sub of entry) {
          for (let key in sub) {
            if (key.includes("en_") && sub[key]) {
                // console.log(sub[key]);
            if(situation == "search_traverse_1") {
             if(selected_word == sub[key]) { 
                 console.log(sub[key]);
             keyword = key;

             }
            }  else if( situation == "searching_traverse_2" && key == keyword ) {
               console.log(sub[key]);
            }
            }
          }
        }
      } else {
        // a_action special case
        if (x === 0) {
          for (let j = 0; j < a_action_check.length; j++) {
            let key = a_action_check[j];
            if (entry[key]?.en) {
              //console.log(entry[key].en);

              if(situation == "search_traverse_1") {
             if(selected_word == entry[key]?.en) { 
                 console.log(entry[key]?.en);
             keyword = key;
             
             }
            }  else if( situation == "searching_traverse_2" && key == keyword ) {
               console.log(entry[key]?.en);
            }
            }
          }
        } else {
          // other categories: object with keys containing "en_"
          for (let key in entry) {
            if (key.includes("en_") && entry[key]) {
             // console.log(entry[key]);

             if(situation == "search_traverse_1") {
             if(selected_word == entry[key]) { 
                 console.log(entry[key]);
             keyword = key;
             
             }
            }  else if( situation == "searching_traverse_2" && key == keyword ) {
               console.log(entry[key]);
            }
            }
          }
        }
      }

    }
  }



  if(keyword !== "") {
      //alert(keyword)
    if(situation == "searching_traverse_2") {
        keyword = ""
    } else {
    loop_words("searching_traverse_2")
  
    }

}

}

loop_words("search_traverse_1");
</script>
