<body>

        <div id="app_container">

            <div id="choose_lang_page">

        </div>
        
            <div id="app_translator">
                <div id="left_bar"> 
                    <button onclick="createRoom()">Create Room</button>
                    <div id="room_section">

                    </div>
                </div>
                <div id="main_translator">
                    <div id="chat_Page"></div>
                    <div id="send_container">
                    <input id="input_box" value="hello world">
                    <button id="new_chat_input">New Button</button>
                    <p id="jp"></p>
                    <p id="romaji"></p>
                    </div>
                </div>
            </div>
        </div>
<script src="totaljapanese2.js"></script>
<script>
  var app_chat_data = {};

  var languages_array = ["english", "japanese", "arabic", "chinese"];

    const languageMap = {
  english: "en",
  japanese: "ja",
  arabic: "ar",
  chinese: "zh",
  french: "fr",
  spanish: "es",
  german: "de"
};


  var chatroom_language = "";

  var chatroom_number = "";

  function choose_language() {
  for (let l = 0; l < languages_array.length; l++) {
    let language = languages_array[l];

    var btn = document.createElement("button");
    btn.innerText = language;

    btn.onclick = function () {
      chatroom_language = language;

      // create language if not exists
      if (!app_chat_data[language]) {
        app_chat_data[language] = {};
        var roomCount = Object.keys(app_chat_data[chatroom_language]).length;
        if (roomCount == 0) {
            alert("there is no room")
            const roomName = "room" + (roomCount + 1);
            app_chat_data[chatroom_language][roomName] = [];
            chatroom_number = roomName;
            show_room(app_chat_data[chatroom_language][chatroom_number])
            navbar_rooms()
        } 
      } else {
            alert("there is is a room")
            // choose the first room
            var room_key = Object.keys(app_chat_data[chatroom_language]);
            var default_room = room_key[0];
            chatroom_number = default_room;
            console.log("First room:", default_room);
            console.log(app_chat_data[chatroom_language][default_room]);
            show_room(app_chat_data[chatroom_language][default_room]);
            
        }




      console.log("Language selected:", chatroom_language);
      console.log(app_chat_data);
    };

    document.getElementById("choose_lang_page").appendChild(btn);
  }
}

choose_language();


async function translateText(text_data, para, r) {
  const text = text_data.trim();
  if (!text) return;

  const targetLang = languageMap[chatroom_language];

  if (!targetLang) {
    alert("Unsupported language");
    return;
  }

  const params = new URLSearchParams({
    client: "gtx",
    sl: "en",                 // always English
    tl: targetLang,           // dynamic target
    dj: "1",
    ie: "UTF-8",
    oe: "UTF-8",
    q: text
  });

  params.append("dt", "t");
  params.append("dt", "rm"); // transliteration if available

  const url =
    "https://translate.googleapis.com/translate_a/single?" +
    params.toString();

  const res = await fetch(url);
  const data = await res.json();

  const sentences = data.sentences || [];

  const translated = sentences.map(s => s.trans).join("");
  const translit = sentences.map(s => s.translit || "").join(" ").trim();

  // UI output (rename ids later if you want)
  document.getElementById("jp").textContent = translated;
  document.getElementById("romaji").textContent = translit;

  const data_input = [
    text,        // English
    translated,  // Target language
    translit     // Transliteration (if any)
  ];

  if (para === "edit") {
    app_chat_data[chatroom_language][chatroom_number][r] = data_input;
  } else {
    app_chat_data[chatroom_language][chatroom_number].push(data_input);
  }

  show_room(app_chat_data[chatroom_language][chatroom_number]);
}


function navbar_rooms() {
  const roomSection = document.getElementById("room_section");
  roomSection.innerHTML = ""; // ✅ clear old buttons

  const rooms = Object.keys(app_chat_data[chatroom_language]);

  for (let r_no = 0; r_no < rooms.length; r_no++) {
    const roomName = rooms[r_no];

    const button_room = document.createElement("p");
    button_room.innerText = roomName;

    button_room.onclick = function () {
      chatroom_number = roomName;
      show_room(app_chat_data[chatroom_language][roomName]);
    };

    roomSection.appendChild(button_room);
  }
}


var toggle = ""

const COLORS = [
  "red", "green", "blue", "orange", "purple",
  "brown", "teal", "pink", "grey", "black"
];

async function show_room(room_data) {
    const chatPage = document.getElementById("chat_Page");
    chatPage.innerHTML = "";

    for (let r = 0; r < room_data.length; r++) {
        const isEven = r % 2 === 0;
        const toggleClass = isEven ? "chat_container chat__right" : "chat_container chat__left";

        const chatContainer = document.createElement("div");
        chatContainer.className = toggleClass;

        const [enText, jpText, rmText] = room_data[r];

        // -------------------------------
        // Color Highlight + Display
        // -------------------------------
        const highlightContainer = document.createElement("div");
        highlightContainer.className = "highlight_container";

        await render_colour_highlight_pure(enText, jpText, rmText, highlightContainer);


        chatContainer.appendChild(highlightContainer);

        // -------------------------------
        // Edit Button
        // -------------------------------
        const editBtn = document.createElement("p");
        editBtn.className = "edit_english";
        editBtn.innerText = "edit_text";

        editBtn.onclick = () => openEditContainer(r, chatContainer);
        chatContainer.appendChild(editBtn);

        // -------------------------------
        // Append Japanese text (if needed)
        // -------------------------------
        const jpP = document.createElement("p");
        jpP.className = "output_jp";
        jpP.innerText = jpText;
        chatContainer.appendChild(jpP);

        const rmP = document.createElement("p");
        rmP.className = "output_jptr";
        rmP.innerText = rmText;
        chatContainer.appendChild(rmP);

        // -------------------------------
        // Append to main chat page
        // -------------------------------
        chatPage.appendChild(chatContainer);
    }

    // -------------------------------
    // Edit Container Function
    // -------------------------------
    function openEditContainer(r_index, chatContainer) {
        // Avoid multiple edit boxes
        if (chatContainer.querySelector(".edit_container")) return;

        const editContainer = document.createElement("div");
        editContainer.className = "edit_container";

        const input = document.createElement("input");
        input.className = "edit_input_data";
        input.value = app_chat_data[chatroom_language][chatroom_number][r_index][0];

        const sendBtn = document.createElement("button");
        sendBtn.className = "send_edit";
        sendBtn.innerText = "Send";

        sendBtn.onclick = async () => {
            await translateText(input.value, "edit", r_index);
            editContainer.remove();
        };

        const cancelBtn = document.createElement("button");
        cancelBtn.className = "cancel_edit";
        cancelBtn.innerText = "Cancel";

        cancelBtn.onclick = () => editContainer.remove();

        editContainer.appendChild(input);
        editContainer.appendChild(sendBtn);
        editContainer.appendChild(cancelBtn);

        chatContainer.appendChild(editContainer);
    }
}

async function render_colour_highlight_pure(enText, jpText, rmText, container) {
    const COLORS = ["red","green","blue","orange","purple","brown","teal","pink","grey","black"];
    let colorIndex = 0;

    const enWords = enText.trim().split(/\s+/);
    const jpWords = jpText.trim().split(/\s+/);
    const rmWords = rmText.trim().split(/\s+/);

    const enP = document.createElement("p");
    const jpP = document.createElement("p");
    const rmP = document.createElement("p");

    // Build JP spans
    const jpSpans = jpWords.map(word => {
        const span = document.createElement("span");
        span.innerText = word + " ";
        jpP.appendChild(span);
        return span;
    });

    // Build RM spans
    const rmSpans = rmWords.map(word => {
        const span = document.createElement("span");
        span.innerText = word + " ";
        rmP.appendChild(span);
        return span;
    });

    const jpUsed = new Array(jpWords.length).fill(false);

    for (let i = 0; i < enWords.length; i++) {
        const enWord = enWords[i];
        const spanEn = document.createElement("span");
        spanEn.innerText = enWord + " ";

        let apiToken = "";
        try {
            const { jp } = await translateWord(enWord);
            apiToken = jp;
        } catch (e) {
            console.error("API error:", e);
        }

        let matchedIndex = -1;
        for (let j = 0; j < jpWords.length; j++) {
            if (jpUsed[j]) continue;
            if (apiToken && jpWords[j].includes(apiToken)) {
                matchedIndex = j;
                break;
            }
        }

        if (matchedIndex !== -1) {
            const color = COLORS[colorIndex % COLORS.length];
            colorIndex++;

            spanEn.style.color = color;
            spanEn.style.fontWeight = "bold";

            jpSpans[matchedIndex].style.color = color;
            jpSpans[matchedIndex].style.fontWeight = "bold";

            if (rmSpans[matchedIndex]) {
                rmSpans[matchedIndex].style.color = color;
                rmSpans[matchedIndex].style.fontWeight = "bold";
            }

            jpUsed[matchedIndex] = true;
        }

        enP.appendChild(spanEn);
    }

    container.innerHTML = "";
    container.appendChild(enP);
    container.appendChild(jpP);
    container.appendChild(rmP);
}


// Minimal API wrapper
async function translateWord(word) {
    const targetLang = languageMap[chatroom_language] || "ja";
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLang}&dt=t&dt=rm&q=${encodeURIComponent(word)}`;
    const res = await fetch(url);
    const data = await res.json();

    const jp = data[0][0]?.[0] || "";
    const rm = data[0][1]?.[2] || "";

    return { jp, rm };
}


 



  function createRoom() {
  if (!chatroom_language) {
    alert("Select a language first");
    return;
  }

  var roomCount = Object.keys(app_chat_data[chatroom_language]).length + 1;
  var roomName = "room" + roomCount;

  app_chat_data[chatroom_language][roomName] = [];
  chatroom_number = roomName;

  navbar_rooms()
  console.log("Room created:", roomName);
  console.log(app_chat_data);
}





document.getElementById("new_chat_input").onclick = async function () {
  if (!chatroom_language || !chatroom_number) {
    alert("Select language and room first");
    return;
  }

  await translateText(document.getElementById("input_box").value); // wait for fetch + push
  console.log(app_chat_data);
};






</script>
