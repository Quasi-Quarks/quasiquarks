<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Div Plot</title>

<style>
  #plotArea {
    width: 400px;
    height: 300px;
    border: 2px solid black;
    position: relative;
    background: #f5f5f5;
  }

  .dot {
    width: 0.1px;
    height: 0.1px;
    background: red;
    border-radius: 50%;
    position: absolute;
    transform: translate(-50%, -50%);
  }
</style>

</head>
<body>

<h2>Plot With Divs</h2>
<div id="plotArea"></div>

<!-- Load the array FIRST -->
<script src="plots.js"></script>

<!-- Then your plotting code -->
<script>
  const plot = document.getElementById("plotArea");

  points.forEach(p => {
    const dot = document.createElement("div");
    dot.className = "dot";
    dot.style.left = p.x + "px";
    dot.style.top  = p.y + "px";
    plot.appendChild(dot);
  });
</script>

</body>
</html>
